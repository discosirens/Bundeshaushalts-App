<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haushalt umschichten</title>
  <meta name="description" content="Wie würdest du den Bundeshaushalt 2026 verteilen? Geld zwischen 14 Bereichen verschieben.">
  <meta name="theme-color" content="#0f1630">
  <link rel="stylesheet" href="css/stil.css">
</head>
<body data-seite="um">
  <header class="topbar">
    <a class="marke" href="index.html" data-intern data-t-html="marke">Bundeshaushalt <span>verständlich</span></a>
    <div class="topbar-rechts">
      <nav class="hauptnav" aria-label="Hauptnavigation">
        <a href="index.html" data-intern data-t="nav.ueberblick">Überblick</a>
        <a href="umschichten.html" data-intern aria-current="page" data-t="nav.verteilen">Selbst verteilen</a>
      </nav>
      <nav class="sprachwahl" data-t-label="nav.sprache" aria-label="Sprache">
        <a data-lang="de" hreflang="de" lang="de">DE</a>
        <a data-lang="en" hreflang="en" lang="en">EN</a>
      </nav>
    </div>
  </header>

  <section class="hero seiten-kopf">
    <div class="hero-inhalt">
      <p class="dachzeile" data-t="um.dachzeile">Mitmachen · Bundeshaushalt 2026</p>
      <h1 data-t="um.ueberschrift">Wie würdest du das Geld verteilen?</h1>
      <p data-t="um.einleitung"></p>
    </div>
  </section>

  <main class="seite mit-bilanz">
    <section class="bereich" aria-labelledby="szenario-titel">
      <h2 id="szenario-titel"><span class="schritt">1</span><span data-t="um.schritt1">Aufgabe wählen</span></h2>
      <div class="szenarien" id="szenarien" role="radiogroup" data-t-label="um.aufgabe.label"></div>
      <p class="szenario-text" id="szenario-text"></p>
    </section>

    <section class="bereich" aria-labelledby="regler-titel">
      <h2 id="regler-titel"><span class="schritt">2</span><span data-t="um.schritt2">Geld verschieben</span></h2>
      <p class="hinweis" data-t="um.schritt2.hinweis"></p>
      <div id="bereiche" class="bereich-liste"></div>
    </section>

    <section class="bereich" aria-labelledby="ergebnis-titel">
      <h2 id="ergebnis-titel"><span class="schritt">3</span><span data-t="um.schritt3">Dein Ergebnis</span></h2>
      <div id="ergebnis" aria-live="polite"></div>
    </section>

    <footer class="quellen">
      <h2 data-t="um.quellen.titel">Quellen und Hinweise</h2>
      <ul>
        <li data-t-html="um.quellen.werte"></li>
        <li data-t="um.quellen.bindung"></li>
        <li data-t="um.quellen.modell"></li>
      </ul>
    </footer>
  </main>

  <div class="bilanz" id="bilanz" aria-live="polite">
    <p class="bilanz-text" id="bilanz-text"></p>
    <button type="button" class="knopf-leise" id="zuruecksetzen" data-t="um.zuruecksetzen">Zurücksetzen</button>
  </div>

  <script src="js/sprache.js"></script>
  <script src="js/umschichten.js"></script>
</body>
</html>
